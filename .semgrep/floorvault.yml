# Vendored Semgrep ruleset for FloorVault.
#
# The registry pack `p/python` resolves at run time - a newly published rule can
# fail CI on unchanged code, and the registry does not serve the resolved pack
# as a pin-able file. This file is a deliberately curated, reviewed snapshot of
# the rule classes relevant to this codebase's risk surface: SQL built from
# validated+quoted identifiers, cryptographic key custody, file permissions,
# subprocesses, and deserialization.
#
# Refresh deliberately: add or adjust rules here in a reviewed commit. Each
# suppression in source must carry a per-line `# nosemgrep` justification.
rules:
  - id: floorvault-sql-interpolation
    languages: [python]
    severity: ERROR
    message: >-
      SQL text built by string interpolation. Identifiers cannot be bound
      parameters; they must pass _safe_identifier and be interpolated through
      _quoted_identifier (bracket-quoted, fail-closed). Suppress only where
      that contract holds.
    patterns:
      - pattern-either:
          - pattern: $CON.execute(f"...", ...)
          - pattern: $CON.executemany(f"...", ...)
          - pattern: $CON.executescript(f"...")
          - pattern: $CON.execute("..." % (...), ...)
          - pattern: $CON.execute("...".format(...), ...)
          - pattern-regex: '(?i)f"\s*(SELECT|INSERT|UPDATE|DELETE|REPLACE|CREATE|DROP|ALTER|PRAGMA|WITH|VALUES)\b[^"\n]*\{[^}]*\}'
          - pattern-regex: "(?i)f'\\s*(SELECT|INSERT|UPDATE|DELETE|REPLACE|CREATE|DROP|ALTER|PRAGMA|WITH|VALUES)\\b[^'\n]*\\{[^}]*\\}"

  - id: floorvault-permissive-chmod
    languages: [python]
    severity: ERROR
    message: >-
      os.chmod with a mode that grants group or other access. Custody files and
      directories must stay owner-only (0o600/0o700).
    patterns:
      - pattern: os.chmod($P, $MODE)
      - metavariable-regex:
          metavariable: $MODE
          regex: '^0?o?[0-7]*([1-7][0-7]|[0-7][1-7])$'

  - id: floorvault-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Unsafe deserialization of attacker-controllable data (pickle, marshal,
      shelve, or yaml.load without SafeLoader). These turn byte streams into
      code execution.
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: marshal.loads(...)
          - pattern: shelve.open(...)
          - pattern: yaml.load($DATA)
          - pattern: yaml.unsafe_load(...)

  - id: floorvault-subprocess-shell
    languages: [python]
    severity: ERROR
    message: >-
      subprocess invocation with shell=True. Build the argv list and keep the
      shell out of it.
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: os.system(...)

  - id: floorvault-insecure-tempfile
    languages: [python]
    severity: ERROR
    message: >-
      tempfile.mktemp() returns a path an attacker can pre-create. Use
      NamedTemporaryFile or mkstemp instead.
    pattern: tempfile.mktemp(...)

  - id: floorvault-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS verification disabled. Key custody and provider traffic must always
      verify certificates.
    patterns:
      - pattern-either:
          - pattern: ssl._create_unverified_context(...)
          - pattern: $X.verify_mode = ssl.CERT_NONE
          - pattern-regex: verify\s*=\s*False

  - id: floorvault-weak-hash
    languages: [python]
    severity: WARNING
    message: >-
      MD5/SHA-1 used in a codebase whose security contract assumes collision
      resistance. Use SHA-256 or better; suppress only where the use is
      provably non-security (e.g. cache naming).
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)

  - id: floorvault-insecure-random
    languages: [python]
    severity: WARNING
    message: >-
      random module used where secrets/os.urandom are required. Key material,
      nonces, and test fixtures that seed security tests must come from a CSPRNG.
    pattern-regex: '\brandom\.(random|randint|randrange|choice|choices|getrandbits|randbytes|shuffle|sample)\b'

  - id: floorvault-eval-exec
    languages: [python]
    severity: ERROR
    message: eval()/exec() on data is code execution. There is no legitimate use here.
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: floorvault-hardcoded-private-key
    languages: [python]
    severity: ERROR
    message: PEM private key material embedded in source.
    pattern-regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
