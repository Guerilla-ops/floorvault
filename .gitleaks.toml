# Gitleaks configuration: the default ruleset plus pinned public-fixture allowlists.
#
# The Project Wycheproof AES-SIV-CMAC vectors are public test data published by
# C2SP: every "key" in them is a test key whose ciphertext is printed beside it.
# The generic-api-key rule flags ~630 of those hex strings. They are allowlisted
# by path rather than by .gitleaksignore fingerprint, because a fingerprint per
# finding would be 630 commit-pinned lines that change whenever the files do.
#
# Why a path allowlist is safe here: tests/test_wycheproof_vectors.py pins both
# files by SHA-256, so any edit to them - including smuggling a real secret into
# an allowlisted file - fails the suite. The regex matches exactly those two
# files and nothing else in the repository; tests/test_wycheproof_vectors.py
# pins that too. Synthetic-fixture findings stay in .gitleaksignore.

[extend]
useDefault = true

[[allowlists]]
description = "Project Wycheproof public test vectors, pinned by SHA-256"
paths = ['''^tests/vectors/wycheproof/(aes_siv_cmac|aead_aes_siv_cmac)_test\.json$''']

# FloorVault and Hermes Vault wire vectors are synthetic test data: every
# "key" derives from a fixed public label in scripts/gen_vectors.py. The
# generic-api-key rule flags the 64-hex master/recovery/beacon key fields.
# Safe by pin: the file is regenerated deterministically and
# tests/test_wire_vectors.py fails if the committed bytes differ from
# generate(), so a hand-smuggled secret cannot survive the drift check.
#
# The hermes_vault_wire_vectors.json name is the same generator's output on the
# main-v2 fork (keys from public "hermes_vault-vector-*" labels). CI checks out
# every branch with fetch-depth: 0, so this branch's history scan walks those
# commits under this config and must allowlist that path too.
[[allowlists]]
description = "FloorVault and Hermes Vault wire vectors, pinned by deterministic regeneration"
# Both names: the file was floorvault_wire_vectors.json before the rename, and
# history scans still walk the old path at old commits.
paths = ['''^tests/vectors/(hermes_vault|floorvault)_wire_vectors\.json$''']

# Original-main compatibility data uses public range(32)/range(32, 64) keys.
# test_floorvault_compatibility.py pins the complete file by SHA-256.
[[allowlists]]
description = "Original FloorVault main compatibility fixture, pinned by SHA-256"
paths = ['''^tests/vectors/main_f3760fe_compat\.json$''']
