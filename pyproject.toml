[build-system]
# Pinned: the build backend runs on every wheel/sdist build but is not covered
# by uv.lock, so an unpinned spec would let a future hatchling release change
# (or compromise) the artifact toolchain.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "floorvault"
version = "0.1.0"
description = "Contextual, misuse-resistant, searchable database encryption for SQLite and beyond — zero C compilation."
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    { name = "Scott Lee", email = "floorbond@pm.me" },
]
keywords = [
    "sqlite",
    "encryption",
    "aead",
    "aes-siv",
    "rfc5297",
    "blind-index",
    "searchable-encryption",
    "crypto",
    "database",
    "floor",
    "floorvault",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Database",
]
requires-python = ">=3.10"
dependencies = [
    # 50.0.0 fixed PYSEC-2026-3552 (distinguishable PKCS#7/S/MIME decryption
    # failure). FloorVault does not call those APIs, but a floor of 43 still
    # let a downstream resolver pick the vulnerable release.
    "cryptography>=50.0.0",
]

[project.urls]
Repository = "https://github.com/Guerilla-ops/floorvault"
Issues = "https://github.com/Guerilla-ops/floorvault/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    # Second, independent AES-SIV implementation used by
    # tests/test_rfc5297_independent.py to cross-check the AES-256-SIV path.
    "pycryptodome>=3.20.0",
    # Dependency CVE audit: gate step 2. Declared here so `uv sync --extra dev`
    # installs it; without this the gate skipped the audit with only a warning
    # while still reporting every security gate as passing.
    "pip-audit>=2.7.0",
    # The Linux Secret Service client calls secretstorage by name, and a name
    # that does not exist silently disabled the whole tier (the import failed
    # inside `except ImportError: return None`). The contract test asserts every
    # name the client uses exists in the real package, so it must be installed
    # wherever the suite runs - not only on Linux - or that assertion is skipped
    # on the very hosts the defect was invisible from.
    "secretstorage>=3.3",
    "bandit>=1.9.4",
    "hypothesis==6.168.3",
    # Pinned for reproducible adapter tests; the sqlalchemy extra below sets the
    # floor this codebase's API surface is written against.
    "sqlalchemy==2.0.46",
    # libsql publishes no cp314 wheels at 0.1.11, so the marker scopes the live
    # embedded-mode test to interpreters the driver actually ships for; hosts
    # without it still run the whole fake-seam suite.
    "libsql>=0.1.0; python_version < '3.14'",
]
# ORM adapter (src/floorvault/sqlalchemy_adapter.py). Not a hard dependency:
# the core library stays SQLAlchemy-free.
sqlalchemy = [
    "sqlalchemy>=2.0.40",
]
# libSQL adapter (src/floorvault/libsql_adapter.py). Optional: the module
# duck-types the connection and never imports the client, so this extra only
# supplies the driver used to create one.
libsql = [
    "libsql>=0.1.0",
]
# macOS Keychain (Tier 2 of AdaptiveKeyProvider) needs the Security framework
# bindings. Without them the provider falls through to Tier 3 and, unless
# allow_disk_fallback is enabled, fails closed. The bindings publish
# macOS-only wheels, so the dep is marked: --all-extras stays resolvable on
# Linux/Windows (dependency audit, editor envs) and pip install .[macos] is
# a no-op off-darwin instead of a build failure.
macos = [
    "pyobjc-framework-Security>=10.0; sys_platform == 'darwin'",
]
# Linux Secret Service (Tier 2) needs the secretstorage client; without it the
# tier reports unavailable and the provider fails closed rather than writing a
# key file.
linux = [
    "secretstorage>=3.3",
]

[project.scripts]
floorvault = "floorvault.inspector:main"

[tool.hatch.build.targets.wheel]
packages = ["src/floorvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
