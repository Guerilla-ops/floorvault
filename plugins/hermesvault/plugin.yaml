name: hermesvault
version: 0.2.0
description: "FloorVault secret source: resolves secrets.hermesvault.env refs (hv:<item>[:field]) from the local FloorVault AES-256-SIV store with configured key custody. Agent credentials only — the browser-fill login vault is untouched."
author: "Scott Lee"
license: MIT
homepage: https://github.com/Guerilla-ops/floorvault/tree/main/plugins/hermesvault
kind: standalone
# Oldest Hermes release the plugin and Hermes' SecretSource conformance kit
# were tested against. Keep it equal to `requires_hermes` in the catalog
# entry (plugin-catalog/hermesvault.yaml in NousResearch/hermes-agent):
# older Hermes enforces only this manifest copy.
requires_hermes: ">=0.21.2"
platforms:
  - linux
  - macos
  - windows
python_dependencies:
  # 0.2.1 is the first release with VaultStore.update_generic_field(), which
  # `hermes hvault put` uses. Hermes installs PyPI requirements only, so this
  # must name a published release; tests/test_hermes_plugin_packaging.py keeps
  # it within the checkout's own version.
  - "floorvault>=0.2.1,<0.3"
  - "pyobjc-framework-Security>=10.0,<13; sys_platform == 'darwin'"
  - "secretstorage>=3.3,<4; sys_platform == 'linux'"
