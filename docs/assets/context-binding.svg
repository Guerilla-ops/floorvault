<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">The context check</title>
  <desc id="desc">An encrypted field for users, record u1, column api_key can be decrypted with the same key and context. With the same key but a different record ID, authentication fails. Context comes from the caller and does not establish permission.</desc>
  <rect width="1200" height="380" fill="#fff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#080808">
    <text x="48" y="43" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#696969">THE CONTEXT CHECK</text>
    <path d="M48 62H1152" stroke="#080808"/>
    <g stroke="#080808" stroke-width="1.5">
      <rect x="48" y="92" width="430" height="210" rx="4" fill="#fff"/>
      <rect x="602" y="92" width="550" height="92" rx="4" fill="#fff"/>
      <rect x="602" y="210" width="550" height="92" rx="4" fill="#080808"/>
      <path d="M478 197H524Q548 197 548 173V160Q548 138 572 138H591M524 197Q548 197 548 221V234Q548 256 572 256H591" fill="none"/>
      <path d="m586 133 6 5-6 5m0 108 6 5-6 5" fill="none"/>
    </g>
    <path d="M50 96V298M604 96V180M604 214V298" stroke="#477d50" stroke-width="4"/>
    <text x="72" y="132" font-size="25" font-weight="700" letter-spacing="-.7">One encrypted field.</text>
    <g font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#696969">
      <text x="72" y="178">table: users    record: u1</text>
      <text x="72" y="208">column: api_key</text>
      <text x="72" y="238">schema: my-app.v1 / version: 1</text>
      <text x="72" y="268">app instance: my-app</text>
    </g>
    <circle cx="630" cy="122" r="4" fill="#477d50"/>
    <text x="644" y="129" font-size="22" font-weight="700" letter-spacing="-.6">Same key + same context</text>
    <text x="626" y="160" font-size="15" fill="#696969">Decryption returns plaintext.</text>
    <circle cx="630" cy="240" r="4" fill="#dd6c39"/>
    <text x="644" y="247" font-size="22" font-weight="700" letter-spacing="-.6" fill="#fff">Same key + different record ID</text>
    <text x="626" y="278" font-size="15" fill="#c8c8c8">Authentication fails; plaintext is not returned.</text>
    <text x="48" y="346" font-size="14" fill="#696969">Context is supplied by the caller. It is authenticated as data, not proof of an authorised request.</text>
  </g>
</svg>
