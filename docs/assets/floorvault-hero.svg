  <title id="fv-hero-title">FloorVault — context-bound field encryption for SQLite</title>
  <desc id="fv-hero-desc">A geometric vault mark beside the FloorVault wordmark and the tagline "Your data. Its place. Cryptographically bound." To the right, an abstract grid of database cells with one field highlighted as cryptographically bound to its coordinates.</desc>
