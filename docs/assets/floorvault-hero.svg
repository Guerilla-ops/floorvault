  <text x="333" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#aabbcf">Your data. Its place. <tspan fill="#65e0bd" font-weight="600">Cryptographically bound.</tspan></text>
