<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">FloorVault — contextual field encryption</title>
  <desc id="desc">The key and context must match to decrypt. Context binding, authenticated encryption at rest, and explicit key custody for application data.</desc>
  <rect width="1200" height="560" fill="#fff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#080808">
    <circle cx="54" cy="48" r="4" fill="#477d50"/>
    <text x="70" y="52" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5">CONTEXTUAL ENCRYPTION</text>
    <text x="1152" y="52" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#696969">PYTHON LIBRARY / BETA</text>
    <path d="M48 78H1152" stroke="#080808"/>
    <text x="45" y="194" font-size="106" font-weight="700" letter-spacing="-7">FloorVault<tspan fill="#dd6c39">.</tspan></text>
    <text x="48" y="247" font-size="28" font-weight="500" letter-spacing="-.7">The key and context must match to decrypt.</text>
    <text x="48" y="285" font-size="16" fill="#696969">Field encryption for SQLite, libSQL, PostgreSQL and MySQL. Your application owns identity and permission.</text>
    <g stroke="#080808" stroke-width="1.5">
      <rect x="48" y="338" width="356" height="174" rx="4" fill="#fff"/>
      <rect x="422" y="338" width="356" height="174" rx="4" fill="#080808"/>
      <rect x="796" y="338" width="356" height="174" rx="4" fill="#fff"/>
    </g>
    <path d="M50 342V508M424 342V508M798 342V508" stroke="#477d50" stroke-width="4"/>
    <g font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2">
      <text x="72" y="373">CONTEXT</text>
      <text x="446" y="373" fill="#fff">ENCRYPTION</text>
      <text x="820" y="373">KEY CUSTODY</text>
    </g>
    <g font-size="25" font-weight="700" letter-spacing="-.8">
      <text x="72" y="419">Bind each field.</text>
      <text x="446" y="419" fill="#fff">Encrypt at rest.</text>
      <text x="820" y="419">Choose the key source.</text>
    </g>
    <g font-size="15" fill="#696969">
      <text x="72" y="453">Table, record, column, schema</text>
      <text x="72" y="476">and application instance.</text>
      <g fill="#c8c8c8">
        <text x="446" y="453">AES-256-SIV with authenticated</text>
        <text x="446" y="476">context in each envelope.</text>
      </g>
      <text x="820" y="453">OS-backed or explicit key custody.</text>
      <text x="820" y="476">No hardware guarantee by default.</text>
    </g>
  </g>
</svg>
