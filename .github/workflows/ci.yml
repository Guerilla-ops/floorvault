name: CI

# Runs the same security gates developers run before pushing
# (scripts/security-check.sh) across every supported OS and Python version, so
# the cross-platform and "zero C compilation" claims are exercised on every
# push rather than only on a maintainer's machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python-version sweep on Linux (regressions here are platform-independent),
  # plus one macOS and one Windows runner for the OS-specific code paths.
  gates:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: the full supported range.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          # macOS and Windows: BOTH ends of the range, not just the default.
          # A platform-specific code path can be fine on the newest interpreter
          # and broken on the oldest (or the reverse), and every defect the
          # matrix has found so far was platform-specific; see
          # docs/CROSS-PLATFORM-CI-FINDINGS-2026-09-15.md. 3.10 is the floor
          # declared in pyproject.toml, so it must be exercised on every OS.
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }
    steps:
      # fetch-depth: 0 is required because gitleaks scans history, not just the
      # tip; a shallow checkout would make the scan meaningless.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up uv and Python ${{ matrix.python }}
        # Pinned to a full version: setup-uv only maintains moving major tags up
        # to v7; v8+ exist as full versions only (v10 does not resolve).
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          # Pin the uv binary too: setup-uv otherwise resolves its latest
          # release, so the tool building the artifacts would move even with
          # the action pinned by SHA.
          version: "0.12.5"

      - name: Sync environment
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Keychain (Tier 2 of the adaptive provider) needs the Security bindings.
            uv sync --extra dev --extra macos
          else
            uv sync --extra dev
          fi
          # The gate audits dependencies with pip-audit; install it into the venv
          # so require_tool finds it under FLOORVAULT_STRICT=1 on every OS.
          uv pip install pip-audit

      - name: Run security gates
        shell: bash
        env:
          FLOORVAULT_STRICT: "1"
          # History is identical on every runner, so the secret scan runs once,
          # in the `secrets` job below.
          FLOORVAULT_SKIP_SECRET_SCAN: "1"
        run: bash scripts/security-check.sh

      # Publish one leg's artifacts as the release identity. The gate prints the
      # digests of what it built on EVERY leg (step 10), so the other platforms
      # stay comparable from the logs; this step exists so that a released wheel
      # can be checked against a CI-built artifact rather than only against a
      # maintainer's machine. One leg only: ten legs publishing the same name
      # would collide, and upload-artifact cannot merge them meaningfully.
      - name: Publish the built artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floorvault-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          # Fail closed: an upload step that silently publishes nothing is worse
          # than no step at all, because it looks like the artifact was captured.
          if-no-files-found: error

  # Secret scanning over full history, once, on Linux.
  #
  # This runs the gitleaks CLI rather than `gitleaks/gitleaks-action`: the Action
  # requires a licence for ORGANIZATION-owned repositories, and this repository
  # moved into the `vaultfloor` organization, at which point the job started
  # failing with "License key is required" and - because the workflow cancels
  # in-progress runs - cancelled five other legs with it. The CLI has no such
  # gate, runs exactly the command the local gate runs, and removes one
  # third-party action from the supply chain.
  #
  # The download is version-pinned and checksum-verified: a scanner that cannot
  # be verified must not silently become the thing that certifies everything else.
  secrets:
    name: secret scan (history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # A shallow checkout would make a history scan meaningless.
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$ASSET" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan history for secrets
        shell: bash
        # Same command as step 1 of scripts/security-check.sh, so CI and a local
        # run agree on what the scan is. Non-zero exit when a secret is found.
        run: gitleaks git --verbose --redact
