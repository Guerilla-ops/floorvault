name: CI

# Platform tests run on four PR cells. Shared checks run independently once;
# weekly, version-tag and manual rehearsal runs expand interpreter coverage.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      expanded:
        description: Run the expanded compatibility matrix (use before release)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Select test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select ordinary or expanded coverage
        id: select
        shell: bash
        env:
          EXPANDED: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.expanded) }}
        run: |
          if [ "$EXPANDED" = "true" ]; then
            echo "matrix=$(python scripts/ci_matrix.py --expanded)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(python scripts/ci_matrix.py)" >> "$GITHUB_OUTPUT"
          fi

  gates:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          version: "0.12.5"
      - name: Sync environment
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            uv sync --extra dev --extra macos
          else
            uv sync --extra dev
          fi
      - name: Full test suite (includes native Windows DPAPI on Windows)
        run: uv run --no-sync pytest -q tests/
      - name: Real-world exercise
        run: uv run --no-sync python scripts/realworld_exercise.py
      - name: Platform mutation controls
        if: matrix.os != 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --no-sync python -u scripts/mutation_check.py --mode curated --scope platform

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Lint and format
        run: |
          uv run --no-sync ruff check src/ tests/ scripts/ fuzz/
          uv run --no-sync ruff format --check src/ tests/ scripts/ fuzz/
      - name: Build and verify universal wheel
        run: |
          uv build
          uv run --no-sync python scripts/verify_wheel.py dist
          uv run --no-sync python -c "import hashlib, pathlib; [print('[DIGEST] sha256', hashlib.sha256(p.read_bytes()).hexdigest(), p.name) for p in sorted(pathlib.Path('dist').iterdir()) if p.name.endswith(('.whl', '.tar.gz'))]"
      - name: Publish the built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floorvault-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  mutations:
    name: Full mutation controls (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Verify every curated mutant
        run: uv run --no-sync python -u scripts/mutation_check.py --mode curated

  # History is identical on all platforms. Keep one pinned CLI scan.

  secrets:
    name: secret scan (history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # A shallow checkout would make a history scan meaningless.
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$ASSET" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan history for secrets
        shell: bash
        # Same command as step 1 of scripts/security-check.sh, so CI and a local
        # run agree on what the scan is. Non-zero exit when a secret is found.
        run: gitleaks git --verbose --redact

  # Static application security testing, once, on Linux.
  #
  # Bandit and Semgrep run here once, outside the platform test matrix. Semgrep
  # is pinned to an exact version, but the p/python registry ruleset is fetched
  # at run time and is not versioned: a newly published rule can fail this job
  # without a code change. That is deliberate - a new rule that fires is a new
  # finding to review - and it is why Semgrep runs here rather than on every leg.
  sast:
    name: SAST (Bandit, Semgrep CE)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Bandit
        # Same command as step 3a of scripts/security-check.sh.
        run: uv run bandit -q -r src/ scripts/ fuzz/
      - name: Semgrep CE
        # Same command as step 3b of scripts/security-check.sh.
        run: |
          SEMGREP_VERSION=1.178.0
          uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan --config p/python --metrics=off --error src/ scripts/ fuzz/

  # Audit all extras once per OS: environment markers can resolve native
  # dependencies that a Linux-only audit cannot see (notably macOS bindings).

  dep-audit:
    name: Dependency CVE audit (all extras)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment (all extras)
        # dev is itself a declared extra, so --all-extras covers it (and
        # pip-audit with it); --all-extras cannot be combined with --extra.
        run: uv sync --all-extras
      - name: pip-audit
        # --no-sync is required: plain `uv run` re-synchronizes the
        # environment to the default extras first, dropping the audited
        # optional extras (and potentially pip-audit itself) before the scan.
        run: uv run --no-sync pip-audit --desc on --skip-editable

  # Live-Vault integration leg (roadmap 1f): the hermetic fake-Vault suite can
  # encode a wrong wire assumption in lockstep with the implementation — a real
  # TLS-terminated Vault cannot. This runs the provider end-to-end against a
  # dev server with verified TLS (the provider refuses plain HTTP by design).
  #
  # The Vault binary is version-pinned and checksum-verified for the same
  # reason gitleaks is: a tool certifying the contract must itself be verified.
  # The root token is a throwaway CI literal for an in-memory dev server that
  # dies with the job — it is not a credential.
  vault-live:
    name: vault transit (live dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Install Vault (pinned, checksum-verified)
        run: |
          set -euo pipefail
          VERSION=2.1.1
          ASSET="vault_${VERSION}_linux_amd64.zip"
          SHA256=8aa90f9cea46f541fc7baa3d0ec692fc06afde9a248cc1f2dcac46a567c6f56b
          curl -sSfL -o "$ASSET" \
            "https://releases.hashicorp.com/vault/${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          unzip -q "$ASSET" vault
          sudo install -m 0755 vault /usr/local/bin/vault
          vault version
      - name: Start Vault dev server (TLS) and provision the transit key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vault-tls"
          nohup vault server -dev -dev-tls \
            -dev-tls-cert-dir="$RUNNER_TEMP/vault-tls" \
            -dev-root-token-id=fv-ci-token \
            -dev-listen-address=127.0.0.1:8200 \
            >"$RUNNER_TEMP/vault-dev.log" 2>&1 &
          export VAULT_ADDR="https://127.0.0.1:8200"
          export VAULT_CACERT="$RUNNER_TEMP/vault-tls/vault-ca.pem"
          export VAULT_TOKEN="fv-ci-token"
          for i in $(seq 1 30); do
            vault status -format=json >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { cat "$RUNNER_TEMP/vault-dev.log"; exit 1; }
            sleep 1
          done
          vault secrets enable transit
          vault write transit/keys/floorvault-ci type=aes256-gcm96 derived=true
      - name: Run the live-Vault contract test
        env:
          FLOORVAULT_LIVE_VAULT: "1"
          VAULT_ADDR: "https://127.0.0.1:8200"
          VAULT_CACERT: ${{ runner.temp }}/vault-tls/vault-ca.pem
          VAULT_TOKEN: fv-ci-token
        run: uv run pytest -q tests/test_vault_transit_live.py
