name: CI

# Platform tests run on four PR cells. Shared checks run independently once;
# weekly, version-tag and manual rehearsal runs expand interpreter coverage.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A merge queue tests the PR merged onto main (and onto the PRs ahead of it)
  # once, so nobody has to update branches by hand. Every required check must run
  # on this event too, or the queue waits for it forever.
  merge_group:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      expanded:
        description: Run the expanded compatibility matrix (use before release)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides what the shared jobs run and how many shards the mutation roster is
  # split into. The shard counts live here once: every shard job reads the same
  # value, so no mutant can fall between shards.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      linux_count: ${{ steps.shards.outputs.linux_count }}
      linux_shards: ${{ steps.shards.outputs.linux_shards }}
      platform_count: ${{ steps.shards.outputs.platform_count }}
      platform_shards: ${{ steps.shards.outputs.platform_shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # On a pull request this is the PR merged into its base: two parents.
          fetch-depth: 2
      - name: Do the changed files need the mutation controls?
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Mutation results depend on code and tests only. A pull request that
          # touches nothing but documentation, examples or repository templates
          # skips the mutation jobs; anything else, and every other event (main,
          # merge queue, tags, schedule), runs them. A path not listed here counts
          # as code, so a new kind of file errs towards running everything.
          heavy=true
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            if [ -s "$RUNNER_TEMP/changed" ]; then
              heavy=false
              while IFS= read -r -d '' file; do
                case "$file" in
                  *.md | docs/* | examples/* | LICENSE | .github/ISSUE_TEMPLATE/* \
                    | .github/pull_request_template.md | .github/copilot-instructions.md) ;;
                  *) heavy=true ;;
                esac
              done < "$RUNNER_TEMP/changed"
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "mutation controls needed: $heavy"
      - name: Shard counts
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          # Linux mutants run about 1 minute each and macOS/Windows about 1.5, so
          # these give 25 to 30 minute shards at the current roster. Raise them
          # as the roster grows; the harness refuses more shards than mutants.
          linux=10
          platform=6
          list() { python3 -c 'import json, sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))' "$1"; }
          {
            echo "linux_count=$linux"
            echo "linux_shards=$(list "$linux")"
            echo "platform_count=$platform"
            echo "platform_shards=$(list "$platform")"
          } >> "$GITHUB_OUTPUT"

  matrix:
    name: Select test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select ordinary or expanded coverage
        id: select
        shell: bash
        env:
          EXPANDED: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.expanded) }}
        run: |
          if [ "$EXPANDED" = "true" ]; then
            echo "matrix=$(python scripts/ci_matrix.py --expanded)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(python scripts/ci_matrix.py)" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: tests ${{ matrix.os }} / py${{ matrix.python }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          version: "0.12.5"
      # Python <3.13 ignores mkdir(mode=0o700) on Windows. Its tempfile
      # directories otherwise inherit the hosted runner's extra account ACEs,
      # which the key-store ACL verifier correctly refuses. Restrict the test
      # parent explicitly; do not relax the production ACL policy.
      - name: Restrict Windows test temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:LOCALAPPDATA ("Temp\floorvault-tests-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testTemp -ErrorAction Stop | Out-Null
          $acl = Get-Acl -LiteralPath $testTemp
          $acl.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)(A;OICI;FA;;;OW)")
          Set-Acl -LiteralPath $testTemp -AclObject $acl -ErrorAction Stop
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - name: Sync environment
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            uv sync --extra dev --extra macos
          else
            uv sync --extra dev
          fi
      - name: Full test suite (includes native Windows DPAPI on Windows)
        run: uv run --no-sync pytest -q tests/
      - name: Real-world exercise
        run: uv run --no-sync python scripts/realworld_exercise.py

  # The platform mutation controls: native custody, filesystem and memory
  # mutants, run where their behaviour can differ. Sharded so a leg takes about
  # 25 minutes, not two hours.
  platform-mutations:
    name: Platform mutants ${{ matrix.os }} ${{ matrix.shard }}/${{ needs.changes.outputs.platform_count }}
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: ${{ fromJSON(needs.changes.outputs.platform_shards) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.5"
      # The mutation harness runs the whole test suite per mutant, so it needs the
      # same restricted temporary directory the test job gives it on Windows.
      - name: Restrict Windows test temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:LOCALAPPDATA ("Temp\floorvault-tests-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testTemp -ErrorAction Stop | Out-Null
          $acl = Get-Acl -LiteralPath $testTemp
          $acl.SetSecurityDescriptorSddlForm("D:P(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)(A;OICI;FA;;;OW)")
          Set-Acl -LiteralPath $testTemp -AclObject $acl -ErrorAction Stop
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - name: Sync environment
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            uv sync --extra dev --extra macos
          else
            uv sync --extra dev
          fi
      - name: Platform mutation controls (shard)
        run: >
          uv run --no-sync python -u scripts/mutation_check.py --mode curated --scope platform
          --shard ${{ matrix.shard }}/${{ needs.changes.outputs.platform_count }}

  # The required check for each platform cell. Branch protection names these
  # contexts, so they keep their names: each one passes only when the test job
  # and, on macOS and Windows, every platform mutant shard passed (or the shards
  # were skipped on a change that cannot affect them).
  gates:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    needs: [matrix, changes, tests, platform-mutations]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Require this cell's controls
        shell: bash
        env:
          TESTS: ${{ needs.tests.result }}
          PLATFORM: ${{ needs.platform-mutations.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          WANTS_PLATFORM: ${{ matrix.os != 'ubuntu-latest' && matrix.python == '3.13' }}
        run: |
          set -euo pipefail
          echo "tests: $TESTS; platform mutants: $PLATFORM (needed: $WANTS_PLATFORM, heavy change: $HEAVY)"
          if [ "$TESTS" != success ]; then
            echo "::error::the test jobs did not all pass ($TESTS)"
            exit 1
          fi
          if [ "$WANTS_PLATFORM" = true ]; then
            if [ "$PLATFORM" = success ] || { [ "$PLATFORM" = skipped ] && [ "$HEAVY" = false ]; }; then
              :
            else
              echo "::error::the platform mutation controls did not pass ($PLATFORM)"
              exit 1
            fi
          fi

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Lint and format
        run: |
          uv run --no-sync ruff check src/ tests/ scripts/ fuzz/
          uv run --no-sync ruff format --check src/ tests/ scripts/ fuzz/
      - name: Build and verify universal wheel
        run: |
          uv build
          uv run --no-sync python scripts/verify_wheel.py dist
          uv run --no-sync python -c "import hashlib, pathlib; [print('[DIGEST] sha256', hashlib.sha256(p.read_bytes()).hexdigest(), p.name) for p in sorted(pathlib.Path('dist').iterdir()) if p.name.endswith(('.whl', '.tar.gz'))]"
      - name: Publish the built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floorvault-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # The curated roster, split across parallel jobs: each mutant runs the whole
  # suite, so one job took 3.5 hours at 236 mutants (and 87 minutes at 165, with
  # a 120 minute limit once cancelling it 13 mutants short). A shard takes about
  # 25 minutes.
  mutation-shards:
    name: Linux mutants ${{ matrix.shard }}/${{ needs.changes.outputs.linux_count }}
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.linux_shards) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Verify this shard of the curated mutants
        run: >
          uv run --no-sync python -u scripts/mutation_check.py --mode curated
          --shard ${{ matrix.shard }}/${{ needs.changes.outputs.linux_count }}

  # The required check, under its old name: it passes only when every shard did,
  # or when the shards were skipped on a change that cannot affect them.
  mutations:
    name: Full mutation controls (Linux)
    needs: [changes, mutation-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard
        shell: bash
        env:
          SHARDS: ${{ needs.mutation-shards.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          set -euo pipefail
          echo "mutant shards: $SHARDS (heavy change: $HEAVY)"
          if [ "$SHARDS" = success ] || { [ "$SHARDS" = skipped ] && [ "$HEAVY" = false ]; }; then
            exit 0
          fi
          echo "::error::the Linux mutation shards did not all pass ($SHARDS)"
          exit 1

  # History is identical on all platforms. Keep one pinned CLI scan.

  secrets:
    name: secret scan (history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # A shallow checkout would make a history scan meaningless.
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$ASSET" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan history for secrets
        shell: bash
        # Same command as step 1 of scripts/security-check.sh, so CI and a local
        # run agree on what the scan is. Non-zero exit when a secret is found.
        run: gitleaks git --verbose --redact

  # Static application security testing, once, on Linux.
  #
  # Bandit and Semgrep run here once, outside the platform test matrix. Semgrep
  # is pinned to an exact version, but the p/python registry ruleset is fetched
  # at run time and is not versioned: a newly published rule can fail this job
  # without a code change. That is deliberate - a new rule that fires is a new
  # finding to review - and it is why Semgrep runs here rather than on every leg.
  sast:
    name: SAST (Bandit, Semgrep CE)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Bandit
        # Same command as step 3a of scripts/security-check.sh.
        run: uv run bandit -q -r src/ scripts/ fuzz/
      - name: Semgrep CE
        # Same command as step 3b of scripts/security-check.sh.
        run: |
          SEMGREP_VERSION=1.178.0
          uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan --config p/python --metrics=off --error src/ scripts/ fuzz/

  # Audit all extras once per OS: environment markers can resolve native
  # dependencies that a Linux-only audit cannot see (notably macOS bindings).

  dep-audit:
    name: Dependency CVE audit (all extras)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment (all extras)
        # dev is itself a declared extra, so --all-extras covers it (and
        # pip-audit with it); --all-extras cannot be combined with --extra.
        run: uv sync --all-extras
      - name: pip-audit
        # --no-sync is required: plain `uv run` re-synchronizes the
        # environment to the default extras first, dropping the audited
        # optional extras (and potentially pip-audit itself) before the scan.
        run: uv run --no-sync pip-audit --desc on --skip-editable

  # Live-Vault integration leg (roadmap 1f): the hermetic fake-Vault suite can
  # encode a wrong wire assumption in lockstep with the implementation — a real
  # TLS-terminated Vault cannot. This runs the provider end-to-end against a
  # dev server with verified TLS (the provider refuses plain HTTP by design).
  #
  # The Vault binary is version-pinned and checksum-verified for the same
  # reason gitleaks is: a tool certifying the contract must itself be verified.
  # The root token is a throwaway CI literal for an in-memory dev server that
  # dies with the job — it is not a credential.
  vault-live:
    name: vault transit (live dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          version: "0.12.5"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Install Vault (pinned, checksum-verified)
        run: |
          set -euo pipefail
          VERSION=2.1.1
          ASSET="vault_${VERSION}_linux_amd64.zip"
          SHA256=8aa90f9cea46f541fc7baa3d0ec692fc06afde9a248cc1f2dcac46a567c6f56b
          curl -sSfL -o "$ASSET" \
            "https://releases.hashicorp.com/vault/${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          unzip -q "$ASSET" vault
          sudo install -m 0755 vault /usr/local/bin/vault
          vault version
      - name: Start Vault dev server (TLS) and provision the transit key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vault-tls"
          nohup vault server -dev -dev-tls \
            -dev-tls-cert-dir="$RUNNER_TEMP/vault-tls" \
            -dev-root-token-id=fv-ci-token \
            -dev-listen-address=127.0.0.1:8200 \
            >"$RUNNER_TEMP/vault-dev.log" 2>&1 &
          export VAULT_ADDR="https://127.0.0.1:8200"
          export VAULT_CACERT="$RUNNER_TEMP/vault-tls/vault-ca.pem"
          export VAULT_TOKEN="fv-ci-token"
          for i in $(seq 1 30); do
            vault status -format=json >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { cat "$RUNNER_TEMP/vault-dev.log"; exit 1; }
            sleep 1
          done
          vault secrets enable transit
          vault write transit/keys/floorvault-ci type=aes256-gcm96 derived=true
      - name: Run the live-Vault contract test
        env:
          FLOORVAULT_LIVE_VAULT: "1"
          VAULT_ADDR: "https://127.0.0.1:8200"
          VAULT_CACERT: ${{ runner.temp }}/vault-tls/vault-ca.pem
          VAULT_TOKEN: fv-ci-token
        run: uv run pytest -q tests/test_vault_transit_live.py

