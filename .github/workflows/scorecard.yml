name: OpenSSF Scorecard

# Independent, third-party assessment of the repository's supply-chain posture
# (pinned dependencies, token permissions, branch protection, SAST, signed
# releases, ...). Findings land in code scanning as SARIF.
#
# The repository is public, so results are published to the public Scorecard
# API (publish_results: true) - the scorecard is queryable at
# securityscorecards.dev and the SARIF upload lands findings in code scanning.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Read-only at the top level; the job grants only what Scorecard documents as
# needed for SARIF upload and result publication.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the raw results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 14
          if-no-files-found: error

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
