name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-custody:
    name: Windows native DPAPI and NTFS custody
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"
          enable-cache: true
          # Same pin as ci.yml: setup-uv otherwise resolves the latest release.
          version: "0.12.5"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run unmocked Windows custody test
        run: uv run pytest -q tests/test_windows_dpapi_live.py

  gitleaks:
    name: Pinned gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$ASSET" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks git --verbose --redact
