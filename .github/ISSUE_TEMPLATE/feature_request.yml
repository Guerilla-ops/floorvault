name: Feature request
description: Suggest an improvement or new capability for FloorVault.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should FloorVault behave? Include an API sketch if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Compatibility and security impact
      description: Tick any that apply. These changes need a spec update and extra review.
      options:
        - label: Changes an on-disk / wire format (docs/SPEC.md)
        - label: Changes the public Python API
        - label: Affects key custody, authentication or validation
